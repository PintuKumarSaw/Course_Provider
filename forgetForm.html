  <div class="container d-flex justify-content-center align-items-center min-vh-100">
    <div class="row w-100">
      <div class="col-12 col-md-6 col-lg-4 mx-auto shadow p-4 rounded bg-body">
        <h2 class="text-center text-dark mb-4">Forget Password</h2>
        <form>
          <div class="mb-3">
            <label for="txtPasswordold" class="form-label text-dark">Old Password</label>
            <input type="password" class="form-control" id="txtPasswordold" placeholder="Enter Old Password">
          </div>
          <div class="mb-3">
            <label for="txtPasswordNew" class="form-label text-dark">New Password</label>
            <input type="password" class="form-control" id="txtPasswordNew" placeholder="Enter New Password">
          </div>
          <div class="mb-3">
            <label for="txtPasswordConfirm" class="form-label text-dark">Confirm Password</label>
            <input type="password" class="form-control" id="txtPasswordConfirm" placeholder="Confirm New Password">
          </div>
          <button type="submit" class="btn btn-primary w-100">Create</button>
          <p class="text-dark mt-3 text-center">Password Created? <a href="login.html">Login</a></p>
        </form>
